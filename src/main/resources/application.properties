spring.application.name=crop-disease-network

# Read secrets from a local .env file if present (see .env.example). Never commit .env.
spring.config.import=optional:file:.env[.properties]

# ---------- Database (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crop_disease?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks it matches the entities.
spring.flyway.enabled=true
# 4 people add migrations in parallel; allow a lower version merged later to still run on dev databases
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- i18n (Feature 19) ----------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ---------- File uploads (case images, Feature 1) ----------
# Images are saved as files in app.upload.dir; the database only stores their paths.
# Spring's limit is set above our own 5 MB rule so ImageValidationService can show a friendly message.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
app.upload.dir=uploads
# Image quality rules: minimum width in pixels and minimum sharpness (variance of Laplacian)
app.image.min-width=400
app.image.min-sharpness=100

# ---------- First admin (created by DataInitializer if none exists) ----------
app.admin.phone=${ADMIN_PHONE:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- AI / LLM provider (Features 2, 3, 8, 21) ----------
app.ai.base-url=${AI_BASE_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.vision-model=${AI_VISION_MODEL:}
app.ai.chat-model=${AI_CHAT_MODEL:}
app.ai.timeout-seconds=30
server.port=8081
spring.jpa.open-in-view=true