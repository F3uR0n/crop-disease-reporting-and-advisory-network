<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.notFound})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5 text-center">
    <h1 class="h3" th:text="#{error.notFound}">Not found</h1>
    <p class="text-muted" th:if="${message}" th:text="${message}"></p>
    <a class="btn btn-success" th:href="@{/}" th:text="#{nav.home}">Home</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
