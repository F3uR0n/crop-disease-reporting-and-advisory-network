<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analytics Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .stat-box { text-align: center; padding: 20px; background: #f8f9fa; border-radius: 8px; border: 1px solid #dee2e6; }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body class="container mt-5">

    <h2 class="mb-4 text-center">System Analytics Dashboard</h2>

    <!-- Stats Row -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="stat-box">
                <h5>AI Diagnosis Accuracy</h5>
                <div class="stat-number" th:text="${analytics.aiAccuracy} + ' %'">0 %</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-box">
                <h5>Avg. Expert Response Time</h5>
                <div class="stat-number" th:text="${analytics.avgExpertResponseTimeHours} + ' hrs'">0 hrs</div>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row">
        <div class="col-md-6">
            <div class="card p-3">
                <h5 class="card-title">Cases by Disease</h5>
                <canvas id="diseaseChart"></canvas>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <h5 class="card-title">Cases by Region</h5>
                <canvas id="regionChart"></canvas>
            </div>
        </div>

        <div class="col-md-12 mt-3">
            <div class="card p-3">
                <h5 class="card-title">Cases by Crop</h5>
                <canvas id="cropChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>

    <!-- JavaScript to render the charts -->
    <script th:inline="javascript">
        const diseaseLabels = /*[[${analytics.diseaseLabels}]]*/ [];
        const diseaseCounts = /*[[${analytics.diseaseCounts}]]*/ [];
        
        const regionLabels = /*[[${analytics.regionLabels}]]*/ [];
        const regionCounts = /*[[${analytics.regionCounts}]]*/ [];

        const cropLabels = /*[[${analytics.cropLabels}]]*/ [];
        const cropCounts = /*[[${analytics.cropCounts}]]*/ [];

        new Chart(document.getElementById('diseaseChart'), {
            type: 'pie',
            data: {
                labels: diseaseLabels,
                datasets: [{
                    data: diseaseCounts,
                    backgroundColor: ['#dc3545', '#ffc107', '#0dcaf0', '#198754']
                }]
            }
        });

        new Chart(document.getElementById('regionChart'), {
            type: 'bar',
            data: {
                labels: regionLabels,
                datasets: [{
                    label: 'Number of Cases',
                    data: regionCounts,
                    backgroundColor: '#0d6efd'
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });

        new Chart(document.getElementById('cropChart'), {
            type: 'line',
            data: {
                labels: cropLabels,
                datasets: [{
                    label: 'Cases per Crop',
                    data: cropCounts,
                    borderColor: '#198754',
                    tension: 0.3,
                    fill: false
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>
</html>
