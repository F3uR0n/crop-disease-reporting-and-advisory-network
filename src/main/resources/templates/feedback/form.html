<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::section})}">
<body>
<section class="max-w-3xl mx-auto p-6 space-y-6">
    <h1 class="text-2xl font-bold" th:text="#{feedback.page.title}">Diagnosis &amp; Recovery Feedback</h1>

    <div th:if="${successMessage}"
         class="p-3 rounded bg-emerald-100 text-emerald-800"
         th:text="#{${successMessage}}">Feedback saved</div>

    <form th:action="@{/cases/{caseId}/feedback(caseId=${caseId})}"
          th:object="${feedbackForm}"
          method="post"
          class="space-y-4">

        <div>
            <label class="block font-medium" th:text="#{feedback.label.decision}">Diagnosis Accuracy Decision</label>
            <select th:field="*{decision}" class="mt-1 w-full border rounded p-2">
                <option value="">--</option>
                <option th:each="d : ${decisions}" th:value="${d}" th:text="${d}">CONFIRMED</option>
            </select>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('decision')}" th:errors="*{decision}"></p>
        </div>

        <div>
            <label class="block font-medium" th:text="#{feedback.label.outcome}">Recovery Outcome</label>
            <select th:field="*{recoveryOutcome}" class="mt-1 w-full border rounded p-2">
                <option value="">--</option>
                <option th:each="o : ${outcomes}" th:value="${o}" th:text="${o}">RECOVERED</option>
            </select>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('recoveryOutcome')}" th:errors="*{recoveryOutcome}"></p>
        </div>

        <div>
            <label class="block font-medium" th:text="#{feedback.label.followUpStatus}">Follow-Up Status</label>
            <select th:field="*{followUpStatus}" class="mt-1 w-full border rounded p-2">
                <option th:each="s : ${followUpStatuses}" th:value="${s}" th:text="${s}">ANSWERED</option>
            </select>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('followUpStatus')}" th:errors="*{followUpStatus}"></p>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-medium" th:text="#{feedback.label.aiLabel}">AI Predicted Disease</label>
                <input type="text" th:field="*{aiLabel}" class="mt-1 w-full border rounded p-2"/>
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('aiLabel')}" th:errors="*{aiLabel}"></p>
            </div>
            <div>
                <label class="block font-medium" th:text="#{feedback.label.expertLabel}">Confirmed / Corrected Disease</label>
                <input type="text" th:field="*{expertLabel}" class="mt-1 w-full border rounded p-2"/>
                <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('expertLabel')}" th:errors="*{expertLabel}"></p>
            </div>
        </div>

        <div>
            <label class="block font-medium" th:text="#{feedback.label.aiConfidence}">AI Confidence (0.0 - 1.0)</label>
            <input type="number" step="0.01" th:field="*{aiConfidence}" class="mt-1 w-full border rounded p-2"/>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('aiConfidence')}" th:errors="*{aiConfidence}"></p>
        </div>

        <div>
            <label class="block font-medium" th:text="#{feedback.label.notes}">Treatment &amp; Recovery Notes</label>
            <textarea rows="4" th:field="*{notes}" class="mt-1 w-full border rounded p-2"></textarea>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></p>
        </div>

        <button type="submit"
                class="px-4 py-2 rounded bg-emerald-600 text-white"
                th:text="#{feedback.action.save}">Submit Feedback</button>
    </form>
</section>
</body>
</html>
