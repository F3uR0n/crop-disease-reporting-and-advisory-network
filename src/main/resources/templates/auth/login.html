<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-4" th:text="#{login.title}">Login</h1>

    <div class="alert alert-success" th:if="${successKey}" th:text="#{${successKey}}">Registered</div>
    <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}">Invalid login</div>
    <div class="alert alert-info" th:if="${param.logout}" th:text="#{login.loggedOut}">Logged out</div>

    <!-- Posted to Spring Security's login filter (see SecurityConfig). th:action adds the CSRF token. -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="phone" class="form-label" th:text="#{field.phone}">Phone</label>
            <input type="tel" id="phone" name="phone" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{field.password}">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100" th:text="#{nav.login}">Login</button>
    </form>
    <p class="mt-3 text-center">
        <a th:href="@{/register}" th:text="#{login.noAccount}">No account? Register</a>
    </p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
