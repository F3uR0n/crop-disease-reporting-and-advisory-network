<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::section})}">
<body>
<section class="max-w-3xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold" th:text="#{escalation.page.title}">Low-Confidence Case Escalation</h1>
        <span class="text-sm text-gray-600"
              th:text="#{escalation.label.threshold} + ': ' + ${threshold}">Threshold: 0.75</span>
    </div>

    <div th:if="${successMessage}"
         class="p-3 rounded bg-emerald-100 text-emerald-800"
         th:text="#{${successMessage}}">Escalated</div>

    <form th:action="@{/cases/{caseId}/escalations(caseId=${caseId})}"
          th:object="${escalationForm}"
          method="post"
          class="space-y-4">

        <div>
            <label class="block font-medium" th:text="#{escalation.label.predictedLabel}">AI Predicted Label</label>
            <input type="text" th:field="*{predictedLabel}" class="mt-1 w-full border rounded p-2"/>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('predictedLabel')}" th:errors="*{predictedLabel}"></p>
        </div>

        <div>
            <label class="block font-medium" th:text="#{escalation.label.confidence}">AI Confidence Score (0.0 - 1.0)</label>
            <input type="number" step="0.01" th:field="*{confidence}" class="mt-1 w-full border rounded p-2"/>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('confidence')}" th:errors="*{confidence}"></p>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" id="aiUnavailable" th:field="*{aiUnavailable}" class="rounded border"/>
            <label for="aiUnavailable" th:text="#{escalation.label.aiUnavailable}">AI service unavailable or uncertain</label>
        </div>

        <div>
            <label class="block font-medium" th:text="#{escalation.label.reason}">Escalation Reason</label>
            <textarea rows="3" th:field="*{reason}" class="mt-1 w-full border rounded p-2"></textarea>
            <p class="text-red-600 text-sm" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></p>
        </div>

        <button type="submit"
                class="px-4 py-2 rounded bg-amber-600 text-white"
                th:text="#{escalation.action.submit}">Escalate Case</button>
    </form>

    <div class="space-y-3">
        <h2 class="text-xl font-semibold" th:text="#{escalation.history.title}">Escalation Log</h2>
        <div th:each="item : ${escalations}" class="border rounded p-3 space-y-1">
            <div class="flex justify-between text-sm font-medium">
                <span th:text="${item.predictedLabel}">UNKNOWN</span>
                <span th:text="#{escalation.label.confidence} + ': ' + ${item.confidence}">0.40</span>
            </div>
            <p class="text-gray-700" th:text="${item.reason}">Reason</p>
        </div>
    </div>
</section>
</body>
</html>
