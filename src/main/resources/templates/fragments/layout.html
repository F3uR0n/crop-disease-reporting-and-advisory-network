<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Shared VIEW fragments. Every page includes:
    <head th:replace="~{fragments/layout :: head(#{page.title})}"></head>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  Views only display data from the Model; no business logic here.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ' + #{app.name}">Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark app-navbar sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <i class="bi bi-flower1 me-1"></i><span th:text="#{app.name}">App</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i><span th:text="#{nav.dashboard}">Dashboard</span></a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('FARMER')">
                    <a class="nav-link" th:href="@{/farmer/cases}"><i class="bi bi-folder2-open me-1"></i><span th:text="#{nav.myCases}">My cases</span></a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('FARMER')">
                    <a class="nav-link" th:href="@{/farmer/cases/new}"><i class="bi bi-camera me-1"></i><span th:text="#{nav.reportCase}">Report a problem</span></a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/cases}"><i class="bi bi-list-check me-1"></i><span th:text="#{nav.allCases}">All cases</span></a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-md-center">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link position-relative me-md-2" th:href="@{/notifications}" th:title="#{nav.notifications}">
                        <i class="bi bi-bell fs-5"></i>
                        <span class="d-md-none ms-1" th:text="#{nav.notifications}">Notifications</span>
                        <span class="badge rounded-pill text-bg-danger bell-badge"
                              th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount}">1</span>
                    </a>
                </li>
                <li class="nav-item">
                    <div class="btn-group btn-group-sm my-2 my-md-0" role="group">
                        <a class="btn btn-outline-light" th:href="@{''(lang='en')}">EN</a>
                        <a class="btn btn-outline-light" th:href="@{''(lang='bn')}">বাংলা</a>
                    </div>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link ms-md-2" th:href="@{/login}" th:text="#{nav.login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/register}" th:text="#{nav.register}">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-light btn-sm ms-md-2">
                            <i class="bi bi-box-arrow-right me-1"></i><span th:text="#{nav.logout}">Logout</span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Coloured badge with icon + translated status name. Usage: th:replace="~{fragments/layout :: statusBadge(${c.status})}" -->
<span th:fragment="statusBadge(status)" class="badge status-badge" th:classappend="|status-${status}|">
    <i th:replace="~{fragments/layout :: statusIcon(${status})}"></i>
    <span th:text="#{'status.' + ${status}}">status</span>
</span>

<!-- One icon per status, used in badges, dashboard cards and the progress bar. -->
<i th:fragment="statusIcon(status)" class="bi" th:classappend="${status.name() == 'SUBMITTED'} ? 'bi-upload'
        : (${status.name() == 'AI_ANALYZED'} ? 'bi-cpu'
        : (${status.name() == 'UNDER_REVIEW'} ? 'bi-person-check'
        : (${status.name() == 'RESOLVED'} ? 'bi-check-circle'
        : (${status.name() == 'REJECTED'} ? 'bi-x-circle' : 'bi-archive'))))"></i>

<footer th:fragment="footer" class="app-footer text-center text-muted small py-4 mt-4">
    <span th:text="#{app.footer}">footer</span>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
