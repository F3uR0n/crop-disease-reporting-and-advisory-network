<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Add New Farm')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="bi bi-plus-circle me-1"></i> Add New Farm Profile</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/farmer/farms/save}" th:object="${farm}" method="post">
                            <div class="mb-3">
                                <label for="farmName" class="form-label fw-semibold">Farm Name</label>
                                <input type="text" id="farmName" th:field="*{farmName}" class="form-control" placeholder="e.g., Green Valley Farm" required>
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label fw-semibold">Location / Address</label>
                                <input type="text" id="location" th:field="*{location}" class="form-control" placeholder="e.g., Sylhet" required>
                            </div>
                            <div class="mb-3">
                                <label for="totalAreaInAcres" class="form-label fw-semibold">Total Area (Acres)</label>
                                <input type="number" step="0.01" id="totalAreaInAcres" th:field="*{totalAreaInAcres}" class="form-control" placeholder="e.g., 5.5" required>
                            </div>
                            <div class="mb-3" th:if="${allCrops != null and !allCrops.empty}">
                                <label class="form-label fw-semibold">Select Current Crops</label>
                                <div class="form-check" th:each="crop : ${allCrops}">
                                    <input class="form-check-input" type="checkbox" th:field="*{currentCrops}" th:value="${crop.id}" th:id="'crop_' + ${crop.id}">
                                    <label class="form-check-label" th:for="'crop_' + ${crop.id}" th:text="${crop.nameEn}">Crop Name</label>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/farmer/farms}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> Back to Farms
                                </a>
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-check-lg me-1"></i> Save Farm
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
